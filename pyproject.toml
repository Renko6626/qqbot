[project]
name = "qqbot"
version = "0.1.0"
description = "A small NoneBot host with explicit plugin controls"
requires-python = ">=3.13"
dependencies = [
  "nonebot2[fastapi,websockets]==2.5.0",
  "nonebot-adapter-onebot==2.4.6",
  "pillow>=12,<13",
  "numpy>=2,<3",
  "opencv-python-headless>=4.12,<5",
  "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
